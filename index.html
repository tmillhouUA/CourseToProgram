<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UA InfoSci: Course to Program Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>UA InfoSci: Course to Program Search</h1>
    <p class="intro">Enter a course to see every College of Information Science program, minor and certificate that uses it, and how.</p>

    <!-- The form handles both Enter and the button; app.js stops the page from reloading. -->
    <form id="search-form" role="search" autocomplete="off">
      <label for="course-input" class="visually-hidden">Course prefix and number</label>
      <input id="course-input" type="search" placeholder="e.g., INFO 550" spellcheck="false">
      <button type="submit">Search</button>
    </form>

    <!-- Status line: cleaned course code, title and match count, or an error message. -->
    <div id="status" aria-live="polite"></div>

    <!-- Scrollable list of result cards; filled by app.js. -->
    <div id="results"></div>

    <footer id="footer"></footer>
  </main>

  <!-- data.js defines the global DATA (generated by build_data.py). It must load before app.js. -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
